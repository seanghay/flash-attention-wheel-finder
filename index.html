<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Attention Wheel Finder</title>
    <meta
      name="description"
      content="Search prebuilt flash-attn wheels by Python, CUDA, PyTorch and Flash-Attention version."
    />
    <script>
      // Set the theme before first paint so there is no light flash on a dark load.
      (function () {
        var stored = localStorage.getItem("theme")
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
