<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Attention Wheel Finder</title>
    <meta
      name="description"
      content="Search prebuilt flash-attn wheels by Python, CUDA, PyTorch and Flash-Attention version, and copy the pip install command."
    />
    <link
      rel="canonical"
      href="https://seanghay.github.io/flash-attention-wheel-finder/"
    />
    <meta name="theme-color" content="#090909" />

    <!-- Absolute URLs are required: crawlers do not resolve relative paths here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flash Attention Wheel Finder" />
    <meta
      property="og:url"
      content="https://seanghay.github.io/flash-attention-wheel-finder/"
    />
    <meta property="og:title" content="Flash Attention Wheel Finder" />
    <meta
      property="og:description"
      content="Search prebuilt flash-attn wheels by Python, CUDA, PyTorch and Flash-Attention version, and copy the pip install command."
    />
    <meta
      property="og:image"
      content="https://seanghay.github.io/flash-attention-wheel-finder/og.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"

    <meta name="twitter:card" content="summary_large_image" />

      content="Flash Attention Wheel Finder — prebuilt flash-attn wheel index"
    />
    <script>
      // Set the theme before first paint so there is no light flash on a dark load.
      (function () {
        var stored = localStorage.getItem("theme")
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches
        document.documentElement.classList.toggle("dark", dark)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
